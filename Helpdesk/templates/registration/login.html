{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar Sesión – Helpdesk TI</title>

  <!-- PWA -->
  <link rel="manifest" href="{% static 'manifest.json' %}">
  <meta name="theme-color" content="#012970">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Helpdesk TI">
  <link rel="apple-touch-icon" href="{% static 'pwa_icon.png' %}">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <style>
    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #1a1f2e 0%, #2d3548 50%, #1a2744 100%);
      display: flex; align-items: center; justify-content: center;
      font-family: 'Segoe UI', sans-serif;
    }
    .login-card {
      background: rgba(255,255,255,.97);
      border-radius: 16px;
      padding: 48px 40px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 24px 64px rgba(0,0,0,.35);
    }
    .login-logo { font-size: 3rem; color: #3b7ddd; }
    .login-title { font-weight: 800; color: #1a1f2e; }
    .login-subtitle { color: #6c757d; font-size: .9rem; }
    .btn-login {
      background: linear-gradient(135deg, #3b7ddd, #1a4fba);
      border: none; border-radius: 10px; padding: 12px;
      font-size: 1rem; font-weight: 600; letter-spacing: .3px;
      transition: transform .2s, box-shadow .2s;
    }
    .btn-login:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(59,125,221,.4);
    }
    .form-control { border-radius: 10px; padding: 12px 16px; border: 1.5px solid #dee2e6; }
    .form-control:focus { border-color: #3b7ddd; box-shadow: 0 0 0 3px rgba(59,125,221,.15); }
    .input-group-text { border-radius: 10px 0 0 10px; background: #f8f9fa; border: 1.5px solid #dee2e6; }
    .input-group .form-control { border-radius: 0 10px 10px 0; }
    .toggle-pass { cursor: pointer; }
    .feature-badge { background: rgba(59,125,221,.08); border-radius: 8px; padding: 6px 10px; font-size: .75rem; }
    #btn-install-pwa {
      border-radius: 10px; font-size: .85rem; font-weight: 600;
      border: 1.5px solid #198754; color: #198754;
      background: rgba(25,135,84,.06);
      transition: background .2s, color .2s;
    }
    #btn-install-pwa:hover { background: #198754; color: #fff; }
  </style>
</head>
<body>
  <div class="login-card">
    <!-- Logo y título -->
    <div class="text-center mb-4">
      <div class="login-logo mb-2"><i class="bi bi-headset"></i></div>
      <h4 class="login-title">Helpdesk TI</h4>
    </div>

    <!-- Mensajes de error -->
    {% if form.errors %}
    <div class="alert alert-danger py-2 small">
      <i class="bi bi-exclamation-circle me-1"></i>
      Usuario o contraseña incorrectos. Intenta nuevamente.
    </div>
    {% endif %}
    {% if messages %}
    {% for message in messages %}
    <div class="alert alert-{{ message.tags }} py-2 small">{{ message }}</div>
    {% endfor %}
    {% endif %}

    <!-- Formulario -->
    <form method="post" id="loginForm" novalidate>
      {% csrf_token %}
      <input type="hidden" name="next" value="{{ next }}">

      <div class="mb-3">
        <label class="form-label fw-semibold small">Usuario</label>
        <div class="input-group">
          <span class="input-group-text"><i class="bi bi-person text-primary"></i></span>
          <input type="text" name="username" id="username" class="form-control"
            autocomplete="username" autofocus>
        </div>
      </div>

      <div class="mb-4">
        <label class="form-label fw-semibold small">Contraseña</label>
        <div class="input-group">
          <span class="input-group-text"><i class="bi bi-lock text-primary"></i></span>
          <input type="password" name="password" id="password" class="form-control"
           autocomplete="current-password">
          <button type="button" class="btn btn-outline-secondary toggle-pass rounded-end" id="togglePass">
            <i class="bi bi-eye" id="toggleIcon"></i>
          </button>
        </div>
      </div>

      <button type="submit" class="btn btn-login btn-primary w-100 text-white mb-3">
        <i class="bi bi-box-arrow-in-right me-2"></i>Iniciar Sesión
      </button>

      <!-- Botón instalar PWA — visible solo cuando el navegador lo soporta -->
      <button type="button" id="btn-install-pwa" class="btn w-100" style="display:none;">
        <i class="bi bi-download me-2"></i>Instalar como App
      </button>
    </form>

  <script src="https://cdn.jsdelivr.net/npm/jquery-3.7.1.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jquery-validation@1.19.5/dist/jquery.validate.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jquery-validation@1.19.5/dist/localization/messages_es.min.js"></script>
  <script>
    // Toggle contraseña
    document.getElementById('togglePass').addEventListener('click', function() {
      const pass = document.getElementById('password');
      const icon = document.getElementById('toggleIcon');
      if (pass.type === 'password') {
        pass.type = 'text';
        icon.className = 'bi bi-eye-slash';
      } else {
        pass.type = 'password';
        icon.className = 'bi bi-eye';
      }
    });

    // jQuery Validate
    $('#loginForm').validate({
      rules: {
        username: { required: true, minlength: 3 },
        password: { required: true, minlength: 4 }
      },
      messages: {
        username: { required: 'Ingresa tu nombre de usuario', minlength: 'Mínimo 3 caracteres' },
        password: { required: 'Ingresa tu contraseña' }
      },
      errorClass: 'is-invalid', validClass: 'is-valid',
      errorPlacement: function(err, el) {
        err.addClass('invalid-feedback');
        el.closest('.input-group').after(err);
      },
      highlight:   function(el) { $(el).addClass('is-invalid').removeClass('is-valid'); },
      unhighlight: function(el) { $(el).removeClass('is-invalid'); }
    });

    // PWA: capturar evento de instalación
    (function () {
      var deferredPrompt = null;
      var btnInstall = document.getElementById('btn-install-pwa');

      // Service Worker
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('/serviceworker.js', { scope: '/' })
          .catch(function(err) { console.warn('SW:', err); });
      }

      // Si el navegador no soporta PWA en absoluto, ocultar el botón
      if (!('serviceWorker' in navigator)) {
        btnInstall.style.display = 'none';
      } else {
        // Mostrar el botón por defecto — se ocultará si ya está instalada
        btnInstall.style.display = 'block';
      }

      // Si ya está corriendo como PWA instalada, ocultar el botón
      if (window.matchMedia('(display-mode: standalone)').matches ||
          window.navigator.standalone === true) {
        btnInstall.style.display = 'none';
      }

      // Capturar el prompt cuando el navegador lo ofrece
      window.addEventListener('beforeinstallprompt', function (e) {
        e.preventDefault();
        deferredPrompt = e;
        btnInstall.style.display = 'block';
      });

      btnInstall.addEventListener('click', function () {
        if (deferredPrompt) {
          // Chrome/Edge: usar el prompt nativo
          deferredPrompt.prompt();
          deferredPrompt.userChoice.then(function (choice) {
            if (choice.outcome === 'accepted') {
              btnInstall.style.display = 'none';
            }
            deferredPrompt = null;
          });
        } else {
          // Fallback: instrucciones manuales según plataforma
          var isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent);
          var msg = isIOS
            ? 'En Safari: toca el botón Compartir y selecciona "Agregar a pantalla de inicio".'
            : 'En Chrome: abre el menú (⋮) y selecciona "Instalar aplicación" o "Agregar a pantalla de inicio".';
          Swal.fire({
            icon: 'info',
            title: 'Instalar Helpdesk TI',
            text: msg,
            confirmButtonText: 'Entendido',
            confirmButtonColor: '#198754',
          });
        }
      });

      window.addEventListener('appinstalled', function () {
        btnInstall.style.display = 'none';
        deferredPrompt = null;
      });
    })();

    // Mensaje de bienvenida (solo primera visita)
    if (!sessionStorage.getItem('login_visited')) {
      sessionStorage.setItem('login_visited', '1');
      setTimeout(() => {
        Swal.fire({
          icon: 'info',
          title: 'Bienvenido al Sistema',
          html: 'Inicia sesión con tus credenciales para acceder al <strong>Centro de Soporte TI</strong>.',
          confirmButtonText: 'Entendido',
          confirmButtonColor: '#3b7ddd',
          timer: 6000,
        });
      }, 500);
    }
  </script>
</body>
</html>
