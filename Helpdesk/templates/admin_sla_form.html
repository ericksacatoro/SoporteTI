{% extends "plantillaPrincipal.html" %}
{% block title %}{{ title }} – Helpdesk TI{% endblock %}
{% block page_title %}{{ title }}{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-lg-6">
    <div class="card border-0 shadow-sm">
      <div class="card-header bg-white border-0 py-3">
        <h5 class="mb-0 fw-bold"><i class="bi bi-shield-check me-2 text-primary"></i>{{ title }}</h5>
      </div>
      <div class="card-body">
        <form method="post" id="slaForm" novalidate>
          {% csrf_token %}
          <div class="mb-3">
            <label class="form-label fw-semibold">Nombre del SLA <span class="text-danger">*</span></label>
            <input type="text" name="name" class="form-control"
              value="{{ sla.name|default:'' }}" placeholder="Ej: Crítico, Normal, Bajo">
          </div>
          <div class="row g-3 mb-3">
            <div class="col-6">
              <label class="form-label fw-semibold">Tiempo de respuesta (horas) <span class="text-danger">*</span></label>
              <input type="number" name="response_time_hours" class="form-control" min="1"
                value="{{ sla.response_time_hours|default:4 }}">
            </div>
            <div class="col-6">
              <label class="form-label fw-semibold">Tiempo de resolución (horas) <span class="text-danger">*</span></label>
              <input type="number" name="resolution_time_hours" class="form-control" min="1"
                value="{{ sla.resolution_time_hours|default:24 }}">
            </div>
          </div>
          <div class="mb-3">
            <label class="form-label fw-semibold">Descripción</label>
            <textarea name="description" class="form-control" rows="3"
              placeholder="Descripción del nivel de servicio…">{{ sla.description|default:'' }}</textarea>
          </div>
          <div class="mb-4">
            <div class="form-check">
              <input class="form-check-input" type="checkbox" name="is_active" id="is_active"
                {% if not sla or sla.is_active %}checked{% endif %}>
              <label class="form-check-label" for="is_active">SLA activo</label>
            </div>
          </div>
          <div class="d-flex gap-2">
            <button type="submit" class="btn btn-primary px-4">
              <i class="bi bi-save me-1"></i>{{ title }}
            </button>
            <a href="/gestion/slas/" class="btn btn-outline-secondary">Cancelar</a>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
$('#slaForm').validate({
  rules:{
    name:{ required:true, minlength:2 },
    response_time_hours:{ required:true, min:1 },
    resolution_time_hours:{ required:true, min:1 }
  },
  messages:{
    name:{ required:'El nombre es obligatorio' },
    response_time_hours:{ required:'Campo obligatorio', min:'Debe ser al menos 1' },
    resolution_time_hours:{ required:'Campo obligatorio', min:'Debe ser al menos 1' }
  },
  errorClass:'is-invalid', validClass:'is-valid',
  errorPlacement:function(e,el){ e.addClass('invalid-feedback'); el.after(e); },
  highlight:function(el){ $(el).addClass('is-invalid').removeClass('is-valid'); },
  unhighlight:function(el){ $(el).removeClass('is-invalid').addClass('is-valid'); }
});
</script>
{% endblock %}
